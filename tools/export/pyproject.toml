[project]
name = "gliner-export"
version = "0.1.0"
description = "Export a GLiNER bi-encoder checkpoint to the ONNX artifact the Rust service serves"
requires-python = ">=3.13"
dependencies = [
    "gliner==0.2.29",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "torch>=2.9",
    "transformers>=5.23.0",
]

[dependency-groups]
dev = ["ruff>=0.17.5"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "PERF"]
ignore = ["PLR2004"]
