##### CI #####
# Same gate as the local prek hooks, the coverage gate (model-free, so it runs here), and the runtime image build;
# the train image (PyTorch, 2.4 GB) too once TRAIN_IMAGE is on.
# Logs are kept as an artifact: maintenance.yml hands them to the repair agent on renovate/* branches, with what the
# update changed upstream (upstream-context: versions, release notes, the public API of ort, tokenizers and gliner).
# Model-backed parity needs an exported model and runs locally (make backends).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: hooks (fmt, clippy, bounds, tests, licenses, ruff, zizmor, gitleaks) + coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> data/ops/target"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-about,cargo-llvm-cov
      - name: pinned toolchain
        run: make toolchain
      - name: prek, then coverage (logged for the maintenance agent)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          { make hooks && make coverage; } 2>&1 | tee ci-logs/build-test.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-logs
          path: ci-logs/

  upstream-context:
    name: what the update changed
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-public-api
      - name: nightly rustdoc for cargo public-api
        run: rustup toolchain install nightly --profile minimal
      - name: collect versions, release notes and the public API of ort, tokenizers and gliner
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          mkdir -p /tmp/base
          git archive "$BASE" | tar -x -C /tmp/base
          uv run --no-project python -m tools.upstream --base /tmp/base --head . --output upstream-context --token "$GH_TOKEN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-context
          path: upstream-context/

  image:
    name: runtime image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: gliner:ci

  train-image:
    name: train image
    if: vars.TRAIN_IMAGE == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.train
          push: false
          tags: gliner-train:ci
